[metadata]
name = QuantyLF
version = 0.0.30
author = Peter ufondu
description = QuantyLF is a library to help manage Ligand Field simulations in Quanty with multi-oxidation-state fitting and parallel execution support.
long_description = file: README.md
long_description_content_type = text/markdown
home_page = https://github.com/askobex/LMF
project_urls =
    Bug Tracker = https://github.com/askobex/LMF/issues
    Documentation = https://github.com/askobex/LMF
    Source Code = https://github.com/askobex/LMF
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Science/Research
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Topic :: Scientific/Engineering :: Physics
    Topic :: Scientific/Engineering :: Chemistry

[options]
package_dir =
    = src
include_package_data = True
packages = find:
python_requires = >=3.10
install_requires =
    numpy>=1.20
    matplotlib>=3.3
    scipy>=1.7
    lmfit>=1.0
    
[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest>=7.0
    pytest-cov>=3.0
    black>=22.0
    flake8>=4.0
    mypy>=0.950
docs =
    sphinx>=4.0
    sphinx-rtd-theme>=1.0
test =
    pytest>=7.0
    pytest-cov>=3.0
    pytest-xdist>=2.5
